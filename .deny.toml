[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is complete and only reads syntect's bundled syntax data; no upstream replacement yet" },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
